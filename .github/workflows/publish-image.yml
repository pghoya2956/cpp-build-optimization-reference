name: publish-image

# Builds the optimized image for linux/amd64 and pushes it to GHCR. Two jobs:
#   - it doubles as the per-push compile gate (a build failure fails the push)
#   - it produces the amd64 image that deploy/gpu-verify-job.yaml runs on a GPU
#     node (local dev machines are often arm64; the GPU node is amd64)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'docker/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the optimized image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.optimized
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:gpu-verify
            ghcr.io/${{ github.repository }}:latest
